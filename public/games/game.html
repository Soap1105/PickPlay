<!DOCTYPE html>
<html>

<head>
    <title>PickPlay Room</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" id="game-stylesheet" href=""> <!-- Dynamically loaded css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .hidden-container {
            display: none !important;
        }

        #lobby-container {
            text-align: center;
            padding: 20px;
        }

        .game-select-btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            background-color: #3498db;
            color: white;
            transition: background-color 0.3s;
        }

        .game-select-btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>

<body>
    <!-- 닉네임 입력 모달 (공통) -->
    <div id="nickname-modal" class="modal"
        style="display: none; align-items: center; justify-content: center; z-index: 10000; background: rgba(0,0,0,0.8);">
        <div class="modal-content"
            style="text-align: center; border-radius: 20px; padding: 40px; box-shadow: 0 15px 30px rgba(0,0,0,0.5); max-width: 400px; margin: 0 auto; top: 30%; position: relative;">
            <h2 style="color: #2c3e50; margin-top: 0;">🎮 게임 입장하기</h2>
            <p style="color: #7f8c8d; margin-bottom: 20px;">닉네임을 입력해 주세요 (1~6글자)</p>
            <input type="text" id="nickname-input-modal" placeholder="닉네임 입력"
                style="width: 80%; padding: 15px; font-size: 1.2rem; border-radius: 10px; border: 2px solid #bdc3c7; text-align: center; margin-bottom: 20px; outline: none;">
            <br>
            <button id="join-game-btn" class="start-btn" style="width: 80%; padding: 15px;">방 입장</button>
        </div>
    </div>

    <h1 id="game-title">PickPlay 대기실</h1>

    <div id="main-wrapper">
        <div id="game-container">
            <div id="my-status-bar"><span id="my-role-display">접속 중...</span></div>

            <!-- ================= LOBBY CONTAINER ================= -->
            <div id="lobby-container">
                <h2>대기실에 오신 것을 환영합니다!</h2>
                <p>친구들과 채팅을 하거나, 방장이 아래에서 게임을 선택해 주세요.</p>
                <div id="host-game-selection" style="display: none; margin-top: 30px;">
                    <h3>어떤 게임을 할까요?</h3>
                    <button class="game-select-btn" data-game="bingo">빙고 게임 시작하기</button>
                    <button class="game-select-btn" data-game="liar">라이어 게임 시작하기</button>
                </div>
                <div id="guest-waiting-msg" style="margin-top: 30px;">
                    <p>방장이 게임을 선택하기를 기다리고 있습니다...</p>
                </div>
            </div>

            <!-- ================= BINGO CONTAINER ================= -->
            <div id="bingo-container" class="hidden-container">
                <div class="ready-status-display">준비 인원: 0 / 0</div>

                <div class="setup-area bing-setup" style="display: none;">
                    <h3>👑 빙고 방장 설정</h3>
                    <div class="setting-group">
                        <label class="setting-title">🏆 승리 조건</label>
                        <div class="radio-group">
                            <label><input type="radio" name="win-lines" value="2"> 2줄</label>
                            <label><input type="radio" name="win-lines" value="3" checked> 3줄</label>
                            <label><input type="radio" name="win-lines" value="4"> 4줄</label>
                            <label><input type="radio" name="win-lines" value="5"> 5줄</label>
                        </div>
                    </div>
                    <div class="setting-group">
                        <label class="setting-title">🔄 시작 순서</label>
                        <select id="turn-order-select" style="padding: 5px; font-size: 1rem;">
                            <option value="host_first">👑 방장부터 시계방향</option>
                            <option value="random">🎲 완전 랜덤</option>
                            <option value="join_asc">➡️ 입장 순서대로</option>
                            <option value="join_desc">⬅️ 입장 역순으로</option>
                        </select>
                    </div>
                    <div class="setting-group" id="theme-topic-group">
                        <label class="setting-title">🎨 AI에게 요청할 빙고 주제 입력</label>
                        <input type="text" id="theme-topic-input" placeholder="예: 과일,영화 등"
                            style="width: 100%; padding: 10px; font-size: 1.1rem; border-radius: 5px; border: 1px solid #ccc;">
                    </div>
                    <button id="start-bingo-btn" class="start-btn">주제 생성 및 시작!</button>
                    <button class="return-lobby-btn" style="margin-top: 10px;">대기실로 돌아가기</button>
                </div>

                <div class="waiting-area" style="display: none;">
                    <h3>⏳ 대기 중...</h3>
                    <p>방장이 게임을 설정하고 있습니다.</p>
                </div>

                <div class="player-ui">
                    <h2 id="theme-title" style="display: none;"></h2>
                    <div id="turn-display" style="display: none;"></div>
                    <div id="called-numbers-display"></div>
                    <div id="bingo-board"></div>

                    <div id="input-controls" style="display: none; margin-top: 10px;">
                        <div id="theme-buttons">
                            <button id="load-theme-btn" class="theme-btn-base btn-load" style="display:none;">📂
                                불러오기</button>
                            <button id="save-theme-btn" class="theme-btn-base btn-save" style="display:none;">💾
                                저장</button>
                            <button id="auto-fill-btn" class="theme-btn-base" style="background-color: #2ecc71;">⚡ 자동
                                채우기(테스트)</button>
                        </div>
                        <button id="ready-button">테마 단어 확정! (준비 완료)</button>
                    </div>

                    <button id="bingo-button" style="display: none;">BINGO!</button>
                </div>

                <!-- 빙고 전용 이벤트 디스플레이 -->
                <div id="big-event-display" style="display: none;">
                    <div class="event-content">
                        <div id="event-icon"></div>
                        <div id="event-title"></div>
                        <div id="event-msg"></div>
                    </div>
                </div>
            </div>

            <!-- ================= LIAR CONTAINER ================= -->
            <div id="liar-container" class="hidden-container">

                <div class="setup-area liar-setup" style="display: none; margin-bottom: 20px;">
                    <h3>👑 라이어 게임 방장 설정</h3>
                    <label for="win-target-select" style="font-weight: bold; margin-right: 10px;">목표 승수:</label>
                    <select id="win-target-select"
                        style="padding: 10px; font-size: 1.1rem; border-radius: 5px; margin-right: 15px; border: 1px solid #bdc3c7;">
                        <option value="2">2승</option>
                        <option value="3" selected>3승</option>
                        <option value="4">4승</option>
                    </select>
                    <button id="start-liar-btn" class="start-btn">시작</button>
                    <button class="return-lobby-btn" style="margin-top: 10px;">대기실로 돌아가기</button>
                </div>

                <div class="waiting-area" style="display: none;">
                    <h3>⏳ 대기 중...</h3>
                    <p>방장이 게임을 설정하고 있습니다.</p>
                </div>

                <div class="player-ui liar-player-ui">
                    <h2>게임 준비 중입니다.</h2>
                </div>
            </div>

        </div>

        <div id="right-sidebar">
            <button id="invite-btn"><i class="fas fa-link"></i> 초대 링크 복사</button>
            <div id="user-section">
                <h3>참여자 목록</h3>
                <div id="user-grid"></div>
            </div>
            <div id="chat-section">
                <h3>💬 채팅 기록</h3>
                <div id="chat-history"></div>
            </div>
        </div>
    </div>

    <form id="chat-form" action="">
        <textarea id="chat-input" autocomplete="off" placeholder="채팅을 입력하세요..."></textarea>
        <button type="submit">전송</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/room.js"></script>
    <script src="/js/bingo.js"></script>
    <script src="/js/liar.js"></script>
</body>

</html>
