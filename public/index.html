<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PickPlay - 닉네임 설정</title>
    <meta name="description" content="PickPlay 닉네임 및 아이콘 설정">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 라이트 모드 (기본) */
        :root {
            --accent: #6c63ff;
            --accent2: #ff6584;
            --bg: #cbdceb;
            --card-bg: rgba(240, 245, 250, 0.75);
            --card-border: rgba(45, 75, 105, 0.2);
            --text: #081521;
            --sub: rgba(8, 21, 33, 0.5);
            --input-bg: rgba(45, 75, 105, 0.08);
            --input-border: rgba(45, 75, 105, 0.18);
            --input-text: #081521;
            --input-placeholder: rgba(8, 21, 33, 0.35);
            --arrow-bg: rgba(45, 75, 105, 0.1);
            --arrow-border: rgba(45, 75, 105, 0.2);
            --mascot-bg: rgba(45, 75, 105, 0.06);
            --mascot-border: rgba(45, 75, 105, 0.15);
            --swatch-border: rgba(45, 75, 105, 0.18);
            --shadow: 0 28px 80px rgba(13, 30, 45, 0.12);
        }

        /* 다크 모드 */
        body.dark-mode {
            --bg: #0f0e17;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.1);
            --text: #fffffe;
            --sub: rgba(255, 255, 255, 0.45);
            --input-bg: rgba(255, 255, 255, 0.07);
            --input-border: rgba(255, 255, 255, 0.12);
            --input-text: #fffffe;
            --input-placeholder: rgba(255, 255, 255, 0.28);
            --arrow-bg: rgba(255, 255, 255, 0.07);
            --arrow-border: rgba(255, 255, 255, 0.14);
            --mascot-bg: rgba(255, 255, 255, 0.04);
            --mascot-border: rgba(255, 255, 255, 0.12);
            --swatch-border: rgba(255, 255, 255, 0.18);
            --shadow: 0 28px 80px rgba(0, 0, 0, 0.55);
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            color: var(--text);
            transition: background 0.2s;
        }

        /* 배경 블롭 */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.28;
            pointer-events: none;
        }

        /* 다크 모드에서 blob 강도 낮춤 */
        body.dark-mode .blob { opacity: 0.15; filter: blur(90px); }

        .blob-1 {
            width: 560px;
            height: 560px;
            background: var(--accent);
            top: -160px;
            left: -160px;
            animation: blobDrift1 10s ease-in-out infinite alternate;
        }

        .blob-2 {
            width: 460px;
            height: 460px;
            background: var(--accent2);
            bottom: -140px;
            right: -140px;
            animation: blobDrift2 13s ease-in-out infinite alternate;
        }

        .blob-3 {
            width: 300px;
            height: 300px;
            background: #43e97b;
            top: 50%;
            left: 55%;
            animation: blobDrift3 8s ease-in-out infinite alternate;
        }

        .blob-4 {
            width: 360px;
            height: 360px;
            background: #fdcb6e;
            bottom: -80px;
            left: -80px;
            animation: blobDrift1 11s ease-in-out infinite alternate-reverse;
        }

        .blob-5 {
            width: 260px;
            height: 260px;
            background: #74b9ff;
            top: -60px;
            right: 15%;
            animation: blobDrift2 9s ease-in-out infinite alternate-reverse;
        }

        @keyframes blobDrift1 {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(50px, 35px) scale(1.1); }
        }
        @keyframes blobDrift2 {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(-45px, -30px) scale(1.08); }
        }
        @keyframes blobDrift3 {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(30px, -40px) scale(1.12); }
        }

        /* 카드 */
        .card {
            position: relative;
            z-index: 10;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 52px 56px 48px;
            width: min(480px, 94vw);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: var(--shadow), 0 0 0 1px var(--card-border);
            animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        /* 테마 토글 버튼 */
        .theme-toggle-btn {
            position: absolute;
            top: 18px;
            right: 20px;
            width: 36px;
            height: 36px;
            background: var(--arrow-bg);
            border: 1.5px solid var(--arrow-border);
            border-radius: 50%;
            color: var(--text);
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s;
            z-index: 20;
        }

        .theme-toggle-btn:hover {
            background: rgba(108, 99, 255, 0.2);
            border-color: var(--accent);
            transform: scale(1.1);
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(36px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* 로고 */
        .logo-area {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo-title {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #a29bfe, #fd79a8, #fdcb6e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 섹션 라벨 */
        .section-label {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: var(--sub);
            margin-bottom: 12px;
        }

        /* 마스코트 섹션 */
        .mascot-section {
            margin-bottom: 28px;
            text-align: center;
        }

        .mascot-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .mascot-display {
            width: 120px;
            height: 120px;
            background: var(--mascot-bg);
            border: 2px solid var(--mascot-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .mascot-display:hover {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.15);
        }

        .mascot-display svg {
            width: 100%;
            height: 100%;
        }



        /* 닉네임 입력 */
        .nickname-section {
            margin-bottom: 28px;
        }

        .nickname-input-wrap {
            position: relative;
        }

        .nickname-input {
            width: 100%;
            padding: 16px 60px 16px 20px;
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: 14px;
            color: var(--input-text);
            font-size: 1.1rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .nickname-input::placeholder {
            color: var(--input-placeholder);
            font-weight: 400;
        }

        .nickname-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.2);
        }

        .nickname-input.error {
            border-color: var(--accent2);
            box-shadow: 0 0 0 4px rgba(255, 101, 132, 0.2);
            animation: shake 0.3s ease;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-7px);
            }

            75% {
                transform: translateX(7px);
            }
        }

        .char-count {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.8rem;
            color: var(--sub);
            font-weight: 600;
            pointer-events: none;
        }

        .char-count.warn {
            color: var(--accent2);
        }

        .input-error-msg {
            margin-top: 8px;
            font-size: 0.8rem;
            color: var(--accent2);
            min-height: 18px;
            padding-left: 4px;
        }

        /* 시작 버튼 */
        .start-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 1.1rem;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 28px rgba(108, 99, 255, 0.4);
            position: relative;
            overflow: hidden;
        }

        .start-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 36px rgba(108, 99, 255, 0.5);
        }

        .start-btn:hover::before {
            opacity: 1;
        }

        .start-btn:active {
            transform: translateY(0);
        }
    </style>
</head>

        <!-- 닉네임 입력 -->
        <div class="nickname-section">
            <div class="section-label">닉네임 (1~10글자)</div>
            <div class="nickname-input-wrap">
                <input type="text" id="nickname-input" class="nickname-input" placeholder="닉네임을 입력하세요" maxlength="10"
                    autocomplete="off" autofocus />
                <span class="char-count" id="char-count">0/10</span>
            </div>
            <div class="input-error-msg" id="error-msg"></div>
        </div>

        <!-- 시작 버튼 -->
        <button class="start-btn" id="start-btn">시작하기</button>
    </div>

    <script>
        /* ── 다크/라이트 모드 (game.html과 동일한 localStorage 키 공유) ── */
        function toggleIndexTheme() {
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('pickplay-theme', isDark ? 'dark' : 'light');
            const icon = document.getElementById('index-theme-icon');
            if (icon) icon.textContent = isDark ? '☀️' : '🌙';
        }

        // 페이지 로드 시 저장된 테마 복원
        (function applyStoredTheme() {
            const stored = localStorage.getItem('pickplay-theme');
            const icon = document.getElementById('index-theme-icon');
            if (stored === 'dark') {
                document.body.classList.add('dark-mode');
                if (icon) icon.textContent = '☀️';
            } else {
                // 라이트 모드 기본값
                if (icon) icon.textContent = '🌙';
            }
        })();

        const nicknameInput = document.getElementById('nickname-input');
        const charCount = document.getElementById('char-count');
        const errorMsg  = document.getElementById('error-msg');
        const startBtn  = document.getElementById('start-btn');

        // 저장된 닉네임 복원
        const savedNickname = localStorage.getItem('pp_nickname') || '';
        if (savedNickname) {
            nicknameInput.value = savedNickname;
            updateCharCount();
        }

        // 글자 수 카운터
        function updateCharCount() {
            const len = nicknameInput.value.length;
            charCount.textContent = `${len}/10`;
            charCount.classList.toggle('warn', len >= 9);
        }

        nicknameInput.addEventListener('input', () => {
            updateCharCount();
            if (errorMsg.textContent) errorMsg.textContent = '';
            nicknameInput.classList.remove('error');
        });

        // 시작
        function handleStart() {
            const name = nicknameInput.value.trim();
            if (!name) {
                showError('닉네임을 입력해 주세요!');
                return;
            }
            if (name.length > 10) {
                showError('닉네임은 10글자 이내여야 합니다!');
                return;
            }
            localStorage.setItem('pp_nickname', name);
            if (!localStorage.getItem('pp_color')) {
                localStorage.setItem('pp_color', '#FC944D');
            }

            // redirect 파라미터가 있으면 해당 방으로, 없으면 새 방 생성
            const params = new URLSearchParams(window.location.search);
            const redirect = params.get('redirect');
            if (redirect) {
                window.location.href = redirect;
            } else {
                const roomId = 'room-' + Math.random().toString(36).substring(2, 9);
                window.location.href = `/room/${roomId}`;
            }
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            nicknameInput.classList.add('error');
            nicknameInput.focus();
            setTimeout(() => nicknameInput.classList.remove('error'), 350);
        }

        startBtn.addEventListener('click', handleStart);
        nicknameInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') handleStart();
        });

        updateCharCount();
    </script>
</body>
