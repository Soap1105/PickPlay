<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1254 1254"
     width="1254" height="1254">
  <title>Pick Mascot - Customizable Layered SVG</title>
  <desc>원본 캐릭터의 연속된 실루엣을 유지하면서 색상 변경과 향후 커스터마이징을 지원하는 SVG. 기본 색상은 #FC944D.</desc>

  <style>
    .player-color { fill: #FC944D; }
    .player-shadow { fill: #FC944D; filter: brightness(0.86); }
    .outline {
      stroke: #4A1715;
      stroke-width: 12;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
  </style>

