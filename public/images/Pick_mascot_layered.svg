<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1254 1254"
     width="1254" height="1254">
  <title>Pick Mascot - Layered Customizable SVG</title>
  <desc>
    기본 마스코트. 몸통/뿔/그림자/눈/입을 별도 그룹으로 분리하여
    플레이어 색상 변경과 향후 모자·옷·액세서리 추가가 가능하도록 구성.
  </desc>

  <defs>
    <style>
      .player-color { fill: var(--player-color, #FC944D); }
      .player-shadow { fill: var(--player-shadow, #E87850); }
      .outline { stroke: #4A1715; stroke-width: 14; stroke-linejoin: round; stroke-linecap: round; }
      .fixed-dark { fill: #4A1715; }
    </style>
  </defs>

  <!-- =========================================================
       HORNS: 기본 몸 색상과 함께 플레이어 색상 변경 대상
       ========================================================= -->
  <g id="horns" class="player-color outline">
    <!-- left horn -->
    <path d="M279 487
             C249 447 238 405 246 362
             C254 318 280 278 320 266
             C345 258 350 280 346 310
             C340 347 348 365 375 379
             C393 388 411 390 430 386
             C407 414 365 446 323 473
             C307 483 292 490 279 487 Z"/>
    <!-- right horn -->
    <path d="M975 487
             C1004 447 1015 405 1007 362
             C999 318 973 278 933 266
             C908 258 903 280 907 310
             C913 347 905 365 878 379
             C860 388 842 390 823 386
             C846 414 888 446 930 473
             C946 483 962 490 975 487 Z"/>
  </g>

  <!-- horn inner shading -->
  <g id="horn-shadows" class="player-shadow">
    <path d="M279 487 C253 451 247 410 254 373
             C261 341 278 312 305 293
             C301 341 317 376 350 398
             C329 420 302 450 279 487 Z"/>
    <path d="M975 487 C1001 451 1007 410 1000 373
             C993 341 976 312 949 293
             C953 341 937 376 904 398
             C925 420 952 450 975 487 Z"/>
  </g>

  <!-- =========================================================
       BODY: 몸/팔/다리 전체. 플레이어 색상 변경의 핵심 파츠
       ========================================================= -->
  <g id="body" class="player-color outline">
    <path d="M638 265
             C526 264 421 292 348 350
             C292 394 250 458 229 530
             C212 589 210 651 224 712
             C198 708 172 716 150 734
             C121 758 105 793 111 830
             C119 878 159 911 215 917
             C245 920 276 913 310 897
             C303 935 300 971 306 1007
             C313 1051 340 1082 383 1090
             C430 1099 479 1084 514 1051
             C549 1018 563 1010 587 1010
             C615 1010 639 1010 666 1010
             C691 1010 707 1018 742 1051
             C777 1084 826 1099 873 1090
             C916 1082 943 1051 950 1007
             C956 971 953 935 946 897
             C980 913 1011 920 1041 917
             C1097 911 1137 878 1145 830
             C1151 793 1135 758 1106 734
             C1084 716 1058 708 1032 712
             C1046 651 1044 589 1027 530
             C1006 458 964 394 908 350
             C835 292 750 264 638 265 Z"/>
  </g>

  <!-- body lower shadow -->
  <g id="body-shadow" class="player-shadow">
    <path d="M308 994
             C315 1043 341 1070 383 1078
             C428 1087 473 1073 508 1040
             C526 1023 542 1013 559 1008
             C534 1011 503 1013 473 1011
             C414 1008 354 1001 308 994 Z"/>
    <path d="M968 994
             C961 1043 935 1070 893 1078
             C848 1087 803 1073 768 1040
             C750 1023 734 1013 717 1008
             C742 1011 773 1013 803 1011
             C862 1008 922 1001 968 994 Z"/>
  </g>

  <!-- arm shadows -->
  <g id="arm-shadows" class="player-shadow">
    <path d="M113 824 C124 869 164 894 214 899
             C250 903 281 894 313 878
             C308 892 305 905 303 919
             C272 933 238 939 207 934
             C153 926 119 891 111 845
             C109 837 110 830 113 824 Z"/>
    <path d="M1141 824 C1130 869 1090 894 1040 899
             C1004 903 973 894 941 878
             C946 892 949 905 951 919
             C982 933 1016 939 1047 934
             C1101 926 1135 891 1143 845
             C1145 837 1144 830 1141 824 Z"/>
  </g>

  <!-- =========================================================
       EYES: 고정 파츠. 플레이어 색상과 무관
       ========================================================= -->
  <g id="eyes" class="fixed-dark">
    <ellipse cx="467" cy="586" rx="34" ry="62"/>
    <ellipse cx="787" cy="586" rx="34" ry="62"/>
  </g>

  <!-- =========================================================
       MOUTH: 고정 파츠
       ========================================================= -->
  <g id="mouth" class="outline">
    <path fill="#F7B5C5"
          d="M553 639
             C584 631 620 625 650 625
             C680 625 716 631 747 639
             L741 688
             C735 735 704 764 650 766
             C596 764 565 735 559 688 Z"/>
  </g>

  <!-- mouth upper highlight/shading -->
  <path id="mouth-highlight"
        fill="#F38FA8"
        d="M560 640
           C589 633 620 629 650 629
           C680 629 711 633 740 640
           L738 655
           C710 648 680 644 650 644
           C620 644 590 648 562 655 Z"/>

  <!-- =========================================================
       FUTURE CUSTOMIZATION SLOT
       나중에 모자/옷/안경 SVG를 이 그룹 위에 삽입
       ========================================================= -->
  <g id="customization-layer"></g>
</svg>
